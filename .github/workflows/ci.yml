name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install package
        run: python -m pip install -e .
      - name: Check Python syntax and business rules
        run: |
          python -m compileall -q src scripts packaging tests
          python tests/smoke_countdown.py
          python tests/smoke_goals.py
          python tests/smoke_holidays.py
